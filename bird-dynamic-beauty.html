<meta charset="UTF-8">

<title>野鳥動態美的表現技術｜范兆雄</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&display=swap');
:root{--sand:#c9bc99;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a18;color:#fff;font-family:'Noto Serif TC','Georgia',serif;min-height:100vh;display:flex;flex-direction:column}
.site-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;background:rgba(26,26,24,.92);backdrop-filter:blur(12px);padding:0 32px;height:48px;border-bottom:1px solid rgba(201,188,153,.12)}
.site-nav a{text-decoration:none;font-size:.7rem;letter-spacing:.2em;color:rgba(255,255,255,.5);white-space:nowrap;padding:0 14px;height:48px;display:flex;align-items:center;transition:color .2s;font-family:'Noto Serif TC','Georgia',serif}
.site-nav a:hover{color:rgba(255,255,255,.9)}
.site-nav a.home{color:var(--sand);padding-left:0;margin-right:8px;border-right:1px solid rgba(201,188,153,.2)}
.site-nav .title{font-size:.78rem;color:rgba(255,255,255,.8);letter-spacing:.1em;margin-left:4px}
.site-nav .spacer{flex:1}
.site-nav .counter{font-size:.7rem;color:rgba(255,255,255,.4);letter-spacing:.15em}
.viewer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px 120px;min-height:100vh}
.slide-wrap{width:100%;max-width:900px}
.slide-img{width:100%;display:block;border-radius:2px;box-shadow:0 8px 48px rgba(0,0,0,.6)}
.controls{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(26,26,24,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.07);padding:16px 32px;display:flex;align-items:center;gap:20px}
.btn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);cursor:pointer;font-family:'Noto Serif TC','Georgia',serif;font-size:.75rem;letter-spacing:.15em;padding:8px 20px;border-radius:2px;transition:all .2s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.4)}
.btn:disabled{opacity:.25;cursor:default}
.progress-wrap{flex:1;display:flex;align-items:center;gap:14px}
.progress-bar{flex:1;height:2px;background:rgba(255,255,255,.1);border-radius:1px;cursor:pointer}
.progress-fill{height:100%;background:var(--sand);border-radius:1px;transition:width .15s}
.page-input{background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-family:'Noto Serif TC','Georgia',serif;font-size:.75rem;width:40px;text-align:center;padding:2px 0}
.page-input:focus{outline:none;border-color:var(--sand)}
.total{font-size:.75rem;color:rgba(255,255,255,.3);letter-spacing:.1em}
.hint{position:fixed;bottom:80px;right:32px;font-size:.65rem;color:rgba(255,255,255,.2);letter-spacing:.12em;text-align:right;line-height:2}
</style>
</head>

<nav class="site-nav">

</div>

<div class="controls">

let cur = 0;
const total = slides.length;
function render() {
  document.getElementById('slide-img').src = slides[cur];
  document.getElementById('nav-counter').textContent = (cur+1) + ' / ' + total;
  document.getElementById('page-input').value = cur+1;
  document.getElementById('progress-fill').style.width = ((cur+1)/total*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === total-1;
}
function go(d) { cur = Math.max(0, Math.min(total-1, cur+d)); render(); }
function jumpTo(v) { cur = Math.max(0, Math.min(total-1, parseInt(v)-1||0)); render(); }
function seekTo(e) {
  const bar = e.currentTarget;
  cur = Math.floor(e.offsetX / bar.offsetWidth * total);
  render();
}
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
render();
